name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Hủy run cũ khi có commit mới trên cùng nhánh
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.daidq.io.vn
  IMAGE: registry.daidq.io.vn/do_an/da-backend
  REGISTRY_TS_IP: 100.118.32.97

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=$(git rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Registry chỉ truy cập được qua Tailscale → join runner vào tailnet (ephemeral node)
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.REGISTRY_TS_IP }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # CD: báo Flux quét Harbor ngay → Flux commit tag mới vào repo gitops rồi deploy
      - name: Trigger Flux CD
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
          FLUX_WEBHOOK_TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          body=$(jq -nc --arg image "$IMAGE_REF" '{image: $image}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$FLUX_WEBHOOK_TOKEN" | awk '{print $NF}')
          curl -fsS --retry 3 -X POST "$FLUX_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$sig" \
            -d "$body"
