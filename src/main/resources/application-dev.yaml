server:
  servlet:
    context-path: /api
  port: ${PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}`
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}
      credentials:
        location: file:${GCS_CREDENTIALS_FILE}
      storage:
        enabled: true

# GCP Storage
gcs:
  bucket: ${GCS_BUCKET}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  file:
    path: ./logs
  level:
    root: INFO
    com.backend: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
      base-path: /

